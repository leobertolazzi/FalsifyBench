[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-inductive-game"
version = "0.1.0"
description = "FalsifyBench: evaluating inductive reasoning in LLMs with rule-discovery games"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "CC-BY-SA-4.0"}
authors = [{name = "Leonardo Bertolazzi", email = "leonardo.bertolazzi@unitn.it"}]
keywords = ["llm", "inductive-reasoning", "confirmation-bias", "wason-task", "wordnet"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "matplotlib>=3.10.8",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "together>=1.3.0",
    "pandas>=2.0.0",
    "scipy>=1.17.1",
    "statsmodels>=0.14.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/leobertolazzi/FalsifyBench"
Repository = "https://github.com/leobertolazzi/FalsifyBench"
Issues = "https://github.com/leobertolazzi/FalsifyBench/issues"

[project.scripts]
inductive-game = "src.main:main"
inductive-game-export-annotation-pairs = "src.annotation.export_pairs:main"
inductive-game-compute-annotation-agreement = "src.annotation.agreement:main"
inductive-game-plot-annotation-results = "src.annotation.plot_agreement:main"
inductive-game-annotate-relations = "src.annotation.annotate_relations:main"
inductive-game-plot-results = "src.analysis.plots:main"
inductive-game-error-analysis = "src.analysis.failure:main"
inductive-game-game-level-analysis = "src.analysis.mixed_effects:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
